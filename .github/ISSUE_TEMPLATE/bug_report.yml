name: Bug report
description: Report a bug or unexpected behavior in a FlowWarden library
title: "[Bug] "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Before submitting, please:

        - Check the [open issues](https://github.com/flowwarden-io) to avoid duplicates
        - For **non-trivial bugs**, prepare a minimal, runnable reproduction (pushed to your fork). This dramatically speeds up triage.
        - **Do not report security vulnerabilities here.** Use the [security policy](https://github.com/flowwarden-io/.github/blob/main/SECURITY.md) instead.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps. A link to a runnable repository is the best form of reproduction.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include stack traces, logs, or screenshots if relevant.
    validations:
      required: true

  - type: input
    id: library-version
    attributes:
      label: Library version
      description: e.g. `flowwarden-stream-core 1.0.0-rc.1`
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: e.g. 17, 21
    validations:
      required: true

  - type: input
    id: framework-version
    attributes:
      label: Framework version (Spring Boot, etc.)
      placeholder: e.g. Spring Boot 3.5.0
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Other environment details
      description: OS, container runtime, database version, etc. — anything that might be relevant.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Workarounds you've tried, related issues, anything else.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow the [Code of Conduct](https://github.com/flowwarden-io/.github/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow the Code of Conduct
          required: true
